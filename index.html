<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Blok Oyun Motoru</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* Telefon ters tutulduğunda arayüz 90° döner: oyun yatay, editör dikey görünür */
body.rot #app{inset:auto;top:0;left:100vw;width:100vh;height:100vw;transform:rotate(90deg);transform-origin:0 0}
#top{display:flex;gap:6px;padding:6px;background:#161b22;overflow-x:auto;flex-shrink:0;align-items:center}
button,select,input,textarea{font:inherit;color:inherit}
button{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:8px 10px;touch-action:manipulation;white-space:nowrap}
button.on{background:#1f6feb;border-color:#1f6feb}
button.danger{background:#6e2121;border-color:#8b2c2c}
input,select,textarea{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:6px;min-width:0}
input[type=number]{width:70px}
input[type=color]{padding:2px;width:44px;height:34px}
textarea{width:100%;font:13px/1.4 monospace;min-height:200px}
#main{flex:1;display:flex;min-height:0}
#palette{display:none;width:92px;flex-shrink:0;overflow-y:auto;background:#161b22;padding:4px;flex-direction:column;gap:4px}
body.mode-edit #palette{display:flex}
#palette button{display:flex;align-items:center;gap:6px;font-size:13px;padding:6px;text-align:left}
.sw{width:18px;height:18px;border-radius:4px;flex-shrink:0;border:1px solid rgba(255,255,255,.25)}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
body.mode-play .edit-only{display:none!important}
#playUI{display:none;position:absolute;inset:0;pointer-events:none;z-index:4}
#btnMenu{position:absolute;top:8px;right:8px;pointer-events:auto;z-index:5;padding:6px 10px}
body.mode-play #playUI,body.hud-edit #playUI{display:block}
.hud{position:absolute;pointer-events:auto;touch-action:none}
body.hud-edit .hud{outline:2px dashed #58a6ff;outline-offset:4px;cursor:move}
#joy{position:relative;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none}
.pad{display:grid;grid-template-columns:auto auto;gap:8px;align-items:center;justify-items:center}
#btnQ{grid-column:1 / 3;grid-row:1}
#btnX{grid-column:1;grid-row:2}#btnE{grid-column:2;grid-row:2}
#btnA{grid-column:1;grid-row:3}#btnZ{grid-column:2;grid-row:3}
.pad button{width:56px;height:56px;border-radius:50%;font-weight:700;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25)}
#btnA{width:74px;height:74px;font-size:24px}
#btnA.hot,#btnX.hot{background:#1f6feb;border-color:#58a6ff}
#hotbar{display:flex;gap:3px}
.slot{width:34px;height:34px;background:rgba(13,17,23,.88);border:2px solid #30363d;border-radius:6px;font-size:9px;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:1px}
.slot.sel{border-color:#58a6ff}
#hudBtns,#saveUI{display:flex;gap:6px}
#hudBtns button,#saveUI button{padding:6px 8px;font-size:13px;background:rgba(33,38,45,.92)}
#dlg{display:none;position:absolute;left:8px;right:8px;bottom:8px;background:rgba(22,27,34,.97);border:1px solid #30363d;border-radius:12px;padding:12px;z-index:5}
#dlg.show{display:block}
#dName{font-weight:700;color:#79c0ff;margin-bottom:4px}
#dText{font-size:16px;line-height:1.4;margin-bottom:10px;min-height:2.8em}
#dChoices{display:flex;flex-direction:column;gap:6px}
#dChoices button{text-align:left;white-space:normal}
#toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.show{opacity:1}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#mbox{width:100%;max-width:560px;max-height:88%;overflow:auto;background:#161b22;border-radius:14px 14px 0 0;padding:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:#8b949e;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{min-height:52px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:4px;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.cell.hb{border-color:#58a6ff}
.cell.sel{background:#1f6feb}
.embedded #top{display:none}
/* Oyun modunda üst çubuk gizlenir, alan oyuna kalır (düzenleme için Durdur menüsü) */
body.mode-play #top{display:none}
</style>
</head>
<body class="mode-edit">
<div id="app">
  <div id="top">
    <button id="btnPlay">▶ Oyna</button>
    <button id="btnEdit" class="on">✎ Düzenle</button>
    <select id="sceneSel" class="edit-only"></select>
    <button id="btnAddScene" class="edit-only">+ Sahne</button>
    <button id="btnScene" class="edit-only">⚙ Sahne</button>
    <button id="btnHud" class="edit-only">🧩 HUD</button>
    <button id="btnRecipe" class="edit-only">📖 Tarifler</button>
    <button id="btnExport" class="edit-only">HTML indir</button>
    <button id="btnBackup" class="edit-only">Yedek</button>
    <button id="btnLoad" class="edit-only">Yükle</button>
  </div>
  <div id="main">
    <div id="palette"></div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="playUI">
        <div class="hud" data-hud="joy"><div id="joy"><div id="knob"></div></div></div>
        <div class="hud" data-hud="actions" id="actions">
          <div class="pad">
            <button id="btnX">X</button><button id="btnE">E</button><button id="btnQ">Q</button>
            <button id="btnA">A</button><button id="btnZ">Z</button>
          </div>
        </div>
        <div class="hud" data-hud="hotbar" id="hotbar"></div>
        <div class="hud" data-hud="hudBtns" id="hudBtns">
          <button id="btnQuest">📜 Görevler</button>
        </div>
        <button id="btnMenu">⏸ Durdur</button>
        <div class="hud" data-hud="saveUI" id="saveUI">
          <button id="btnSaveGame">💾 Kaydet</button>
          <button id="btnLoadGame">📂 Yükle</button>
          <button id="btnNewGame">🔄 Baştan</button>
        </div>
      </div>
      <div id="dlg"><div id="dName"></div><div id="dText"></div><div id="dChoices"></div></div>
      <div id="toast"></div>
    </div>
  </div>
</div>
<div id="modal"><div id="mbox">
  <div class="row"><b id="mtitle" style="flex:1"></b><button id="mclose">Kapat</button></div>
  <div id="mbody"></div>
</div></div>
<input type="file" id="fileIn" accept="application/json" hidden>

<script>
let EMBED = /*EMBED*/null;

const T = 32;
const PLAYER_COLOR = '#4fc3f7';
const SLOTS = 18, HOTBAR = 9, STACK = 64;
const TILE = {
  1: {name: 'Taş',   color: '#55657a', solid: true},
  2: {name: 'Su',    color: '#2b6cb0', solid: true},
  3: {name: 'Ağaç',  color: '#2f5d31', solid: true},
  4: {name: 'Çim',   color: '#4c9a3d'},
  5: {name: 'Kum',   color: '#d9c27e'},
  6: {name: 'Ahşap', color: '#7a4f2b'},
  7: {name: 'Kutu',  color: '#b07a2e', solid: true},
  8: {name: 'Yol',   color: '#8b8f96'},
  9: {name: 'Diken',  color: '#6b7280', hurt: 8},  // geçilebilir, üstünde durunca can götürür
  10: {name: 'Ateş', color: '#7a2e0e', hurt: 10}  // geçilebilir, üstünde durunca yakar
};
const PMAX = 100;
const PAL = [
  {k: 'select', label: 'Seç'}, {k: 'erase', label: 'Sil'},
  {k: 'tile:1'}, {k: 'tile:2'}, {k: 'tile:3'}, {k: 'tile:7'},
  {k: 'tile:4'}, {k: 'tile:5'}, {k: 'tile:6'}, {k: 'tile:8'}, {k: 'tile:9'},
  {k: 'npc', label: 'NPC', color: '#ffb74d'}, {k: 'exit', label: 'Çıkış', color: '#ffd54f'},
  {k: 'spawn', label: 'Başlangıç', color: '#9cffb8'},
  {k: 'item', label: 'Eşya', color: '#ffd700'}, {k: 'sign', label: 'Tabela', color: '#c8a165'},
  {k: 'enemy', label: 'Düşman', color: '#e35d5d'},
  {k: 'rain', label: 'Yağmur', color: '#90caf9'},
  {k: 'fire', label: 'Ateş', color: '#ff7043'},
  {k: 'bench', label: 'Tezgâh', color: '#8d6e63'}
];
// HUD öğeleri: stage'in sol-üst köşesine göre konum oranı (0..1)
const HUD_KEYS = ['joy', 'actions', 'hotbar', 'hudBtns', 'saveUI'];
const DEFAULT_HUD = {
  joy:     {x: 0.03, y: 0.62},
  actions: {x: 0.62, y: 0.50},
  hotbar:  {x: 0.10, y: 0.88},
  hudBtns: {x: 0.03, y: 0.02},
  saveUI:  {x: 0.50, y: 0.02}
};
// Yatay (geniş) ekran için varsayılan yerler; oyun yatayken bunlar kullanılır
const DEFAULT_HUD_LAND = {
  joy:     {x: 0.03, y: 0.45},
  actions: {x: 0.78, y: 0.30},
  hotbar:  {x: 0.18, y: 0.78},
  hudBtns: {x: 0.03, y: 0.03},
  saveUI:  {x: 0.45, y: 0.03}
};
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), btnA = $('btnA');

let P, cur, curId, mode = 'edit', tool = 'tile:1', sel = null, modalClose = null;
let W = 1, H = 1, dpr = 1, zoom = 1, cam = {x: 0, y: 0};
let player = {x: 0, y: 0}, exitCool = 0, dlg = null;
let fade = 0, fadeDir = 0, pending = null;
let actionReq = false, interactReq = false, dashReq = false;
let dash = 0, dashCool = 0, face = {x: 0, y: 1};
let nGoal = {}, ePos = {}, atkCool = 0, pHurtCool = 0, walkT = 0, hitFlash = 0;   // nGoal: yürüyen NPC'lerin hedefi   // düşman konumları (oturum içi), zamanlayıcılar
const keys = {}, joyV = {x: 0, y: 0};
let painting = false, lastKey = null, last = performance.now();
let state = freshState();   // oyun sırasında: görevler, slotlar, seçili slot, alınan eşyalar
let drag = null;            // HUD sürükleme

function freshState() { return {quests: {}, slots: new Array(SLOTS).fill(null), hb: 0, picked: {}, unlocked: {}, hp: PMAX, eh: {}, np: {}, obj: {}, out: {}, fol: {}, loc: {}, hunger: PMAX, thirst: PMAX}; }
function normState(s) {
  s = s || {};
  const slots = new Array(SLOTS).fill(null);
  (s.slots || []).forEach((v, k) => { if (k < SLOTS) slots[k] = v; });
  return {quests: s.quests || {}, slots, hb: s.hb || 0, picked: s.picked || {}, unlocked: s.unlocked || {},
    hp: s.hp == null ? PMAX : s.hp, eh: s.eh || {}, np: s.np || {}, obj: s.obj || {}, out: s.out || {}, fol: s.fol || {}, loc: s.loc || {},
    hunger: s.hunger == null ? PMAX : s.hunger, thirst: s.thirst == null ? PMAX : s.thirst};
}
function hudEdit() { return document.body.classList.contains('hud-edit'); }
function uiBusy() { return !!dlg || $('modal').classList.contains('show'); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function newId() { return 'o' + Math.random().toString(36).slice(2, 9); }

/* ---------- veri ---------- */
function borderTiles(w, h) {
  const t = new Array(w * h).fill(0);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)
    if (i === 0 || j === 0 || i === w - 1 || j === h - 1) t[j * w + i] = 1;
  return t;
}
function defaultProject() {
  return {
    start: 'koy',
    scenes: {
      koy: {name: 'Kasaba', w: 16, h: 12, bg: '#1d2d1f', spawn: {x: 3, y: 6},
        npcs: [{x: 6, y: 4, name: 'Yaşlı', color: '#ffb74d',
          text: 'Merhaba yolcu! Bu kasaba çok eski.\n? Kasaba hakkında bilgi ister misin? | (Evet) => Kuzeydeki mağarada bir hazine varmış. | (Hayır) => Peki, iyi yolculuklar.\n@görev başla: Kuzeydeki hazine\nHoşça kal!'}],
        items: [{id: 'altin1', x: 9, y: 8, name: 'Altın', n: 5}],
        signs: [{x: 5, y: 2, text: 'Kuzey yolu: mağara. Dikkatli ol!'}],
        exits: [{x: 15, y: 6, to: 'orman'}]},
      orman: {name: 'Orman', w: 16, h: 12, bg: '#0f2a1a', spawn: {x: 2, y: 6},
        npcs: [{x: 10, y: 6, name: 'Tüccar', color: '#e57373',
          text: 'Hoş geldin! Buradaki en iyi kılıçlar bende.\n? Bir kılıç almak ister misin? | (Evet) => @eşya ver: Kılıç | (Hayır) => Belki sonra gelirsin.\nAfiyet olsun.'}],
        items: [], signs: [],
        exits: [{x: 0, y: 6, to: 'koy'}]}
    }
  };
}
function sanitize(p) {
  p.scenes = p.scenes || {};
  for (const id in p.scenes) {
    const s = p.scenes[id];
    s.name = s.name || id; s.w = s.w || 16; s.h = s.h || 12;
    s.bg = s.bg || '#1d2d1f'; s.npcs = s.npcs || []; s.exits = s.exits || [];
    s.items = s.items || []; s.signs = s.signs || [];
    s.enemies = s.enemies || [];
    s.rains = s.rains || [];
    s.fires = s.fires || [];
    for (const f of s.fires) f.id = f.id || newId();
    s.benches = s.benches || [];
    for (const en of s.enemies) {
      en.id = en.id || newId(); en.name = en.name || 'Düşman';
      en.hp = en.hp || 30; en.dmg = en.dmg == null ? 10 : en.dmg; en.color = en.color || '#e35d5d';
    }
    s.spawn = s.spawn || {x: 1, y: 1};
    for (const n of s.npcs) { n.id = n.id || newId(); n.text = n.text || ''; }
    for (const it of s.items) it.id = it.id || newId();
    for (const sg of s.signs) sg.text = sg.text || '';
    if (!s.tiles || s.tiles.length !== s.w * s.h) s.tiles = borderTiles(s.w, s.h);
    for (const e of s.exits) {
      e.id = e.id || newId();
      if (e.x >= 0 && e.y >= 0 && e.x < s.w && e.y < s.h) s.tiles[e.y * s.w + e.x] = 0;
    }
  }
  if (!p.scenes[p.start]) p.start = Object.keys(p.scenes)[0];
  if (!p.id) p.id = 'p' + Math.random().toString(36).slice(2, 10);
  p.recipesRaw = p.recipesRaw || '';
  p.hud = p.hud || {};
  for (const k of HUD_KEYS) if (!p.hud[k]) p.hud[k] = {...DEFAULT_HUD[k]};
  p.hudL = p.hudL || {};
  for (const k of HUD_KEYS) if (!p.hudL[k]) p.hudL[k] = {...DEFAULT_HUD_LAND[k]};
  return p;
}
const KEY = 'oyun-motoru-v2';
function save() { if (EMBED) return; try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function changed() { save(); }

/* ---------- oyun kaydı (HTML export'ta da çalışır) ---------- */
function gameSaveKey() { return 'oyun-kayit-' + P.id; }
function readSave() {
  try { return JSON.parse(localStorage.getItem(gameSaveKey())); } catch (e) { return null; }
}
function saveGame() {
  try {
    localStorage.setItem(gameSaveKey(), JSON.stringify({scene: curId, x: player.x, y: player.y, state, t: Date.now()}));
    toast('Oyun kaydedildi');
  } catch (e) { toast('Kayıt yapılamadı'); }
}
// Oyun başlarken: kayıt varsa en son kayıt yerinden, yoksa Başlangıç sahnesinin Başlangıç bloğundan
function startPlay() {
  closeDlg(); fade = 0; fadeDir = 0; pending = null;
  dash = 0; dashCool = 0; face = {x: 0, y: 1};
  const d = readSave();
  if (d && P.scenes[d.scene]) {
    curId = d.scene; cur = P.scenes[curId];
    player.x = d.x; player.y = d.y; exitCool = 0.6; ePos = {}; nGoal = {};
    state = normState(d.state);
  } else {
    state = freshState();
    loadScene(P.start);
  }
  renderHotbar();
}
function loadGame() {
  if (!readSave()) return toast('Kayıtlı oyun yok');
  startPlay();
  toast('Kayıt yüklendi');
}
function newGame() {
  closeDlg(); fade = 0; fadeDir = 0; pending = null;
  state = freshState();
  loadScene(P.start);
  renderHotbar();
  toast('Yeni oyun başladı');
}

/* ---------- sahne ve fizik ---------- */
function loadScene(id, sp) {
  curId = id; cur = P.scenes[id];
  const s = sp || cur.spawn;
  player.x = s.x * T + T / 2; player.y = s.y * T + T / 2;
  exitCool = 0.6; ePos = {}; nGoal = {};
}
function solid(i, j) {
  if (i < 0 || j < 0 || i >= cur.w || j >= cur.h) return true;
  if (lockedExitAt(i, j)) return true;
  const v = cur.tiles[j * cur.w + i];
  return !!(TILE[v] && TILE[v].solid);
}
// Kilitli ve henüz açılmamış çıkış, duvar gibi davranır
function lockedExitAt(i, j) {
  return cur.exits.find(e => e.x === i && e.y === j && e.lock && !state.unlocked[e.id]) || null;
}
const R = T * 0.36;
function blocked(x, y) {
  const x0 = Math.floor((x - R) / T), x1 = Math.floor((x + R - 1e-6) / T);
  const y0 = Math.floor((y - R) / T), y1 = Math.floor((y + R - 1e-6) / T);
  for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) if (solid(i, j)) return true;
  return false;
}
function moveBy(dx, dy, sp) {
  const nx = player.x + dx * sp; if (!blocked(nx, player.y)) player.x = nx;
  const ny = player.y + dy * sp; if (!blocked(player.x, ny)) player.y = ny;
}
function inputVec() {
  let x = joyV.x, y = joyV.y;
  if (keys.arrowleft || keys.a) x -= 1;
  if (keys.arrowright || keys.d) x += 1;
  if (keys.arrowup || keys.w) y -= 1;
  if (keys.arrowdown || keys.s) y += 1;
  const m = Math.hypot(x, y);
  if (m > 1) { x /= m; y /= m; }
  return {x, y};
}
function nearest(list) {
  let best = null, bd = 1.2 * T;
  for (const o of list) {
    const d = Math.hypot(o.x * T + T / 2 - player.x, o.y * T + T / 2 - player.y);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}
function nearNpc() {
  let best = null, bd = 1.2 * T;
  for (const n of sceneNpcs()) {
    const p = npcPos(n), d = Math.hypot(p.x - player.x, p.y - player.y);
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}
function nearestInteractable() {
  return nearest(cur.items.filter(o => !state.picked[o.id])) || nearest(cur.signs);
}
// Çıkış: hedef sahnenin Başlangıç bloğunda (sp = null) belirir
function changeScene(id, sp) { pending = {id, sp}; fadeDir = 1; sfx('door'); }

/* ---------- diyalog ve komutlar ---------- */
// Satır türleri: normal metin, "? Soru | (A) => cevap" seçenekli soru, "@komut" görev/eşya komutu
function parseLine(line) {
  // {koşul} ile başlayan satır, koşul sağlanırsa gösterilir (ör. {görev bitti: Ad} Teşekkürler!)
  const cm = line.match(/^\{(.+?)\}\s*(.*)$/);
  if (cm && cm[1].trim() !== 'name') { const it = parseLine(cm[2]); it.cond = cm[1].trim(); return it; }
  if (line[0] === '@') return {cmd: line};
  if (line[0] === '?') {
    const parts = line.slice(1).split('|').map(s => s.trim());
    const q = parts.shift();
    const opts = parts.map(p => {
      const m = p.match(/^\((.*?)\)\s*=>\s*(.*)$/);
      return m ? {label: m[1].trim(), resp: m[2].trim()} : null;
    }).filter(Boolean);
    return opts.length ? {q, opts} : {text: q};
  }
  return {text: line};
}
function parseScript(src) {
  return src.split('\n').map(s => s.trim()).filter(Boolean).map(parseLine);
}
// @görev başla: Ad | @görev bitir: Ad | @eşya ver: Ad [adet] | @eşya al: Ad [adet]
// Koşul: görev aktif/bitti/yok, ya da eşya (adet)
function condMet(c) {
  const m = c.match(/^(görev aktif|görev bitti|görev yok|görev var|eşya)\s*:\s*(.+)$/i);
  if (!m) return true;
  const k = m[1].toLowerCase(), arg = m[2].trim();
  if (k === 'görev aktif') return state.quests[arg] === 'aktif';
  if (k === 'görev bitti') return state.quests[arg] === 'bitti';
  if (k === 'görev yok') return !state.quests[arg];
  if (k === 'görev var') return !!state.quests[arg];
  const mm = arg.match(/^(.*?)\s*(?::\s*|\s+)(\d+)$/);

// "Ad | alış | satış" satırlarından mağaza listesi
// Dördüncü sütun eşya türü: "yemek 10" (can doldurur) ya da "silah 20" (hasar verir)
function parseShop(raw) {
  return (raw || '').split('\n').map(l => l.split('|').map(s => s.trim())).filter(p => p[0]).map(p => {
    const t = (p[3] || '').match(/^(yemek|silah|içecek)\s*(\d+)?$/i);
    const kind = t ? kindWord(t[1]) : null;
    return {
      name: p[0], buy: +p[1] || 0,
      sell: p[2] !== undefined && p[2] !== '' ? +p[2] : Math.floor((+p[1] || 0) / 2),
      kind, val: t && t[2] ? +t[2] : 10

}
function runCmd(line) {
  // @takip et / @takip bırak → konuşan NPC oyuncuyu takip eder ya da durur (aynı sahnede)
  if (/^@takip\s+et\s*$/i.test(line)) { if (dlg && dlg.npc) state.fol[dlg.npc.id] = true; return; }
  if (/^@takip\s+b[ıi]rak\s*$/i.test(line)) {
    const npc = dlg && dlg.npc;
    if (npc && state.fol[npc.id]) {
      const p = npcPos(npc);
      delete state.fol[npc.id]; delete folRt[npc.id];
      state.np[npc.id] = {x: Math.floor(p.x / T), y: Math.floor(p.y / T)};
    }
    return;
  }
  if (/^@mağaza\s*$/i.test(line)) { if (dlg && dlg.npc) dlg.openShop = dlg.npc; return; }
  // @hedef: Görev | Eşya adet  → görev listesinde ilerleme gösterir
  const ob = line.match(/^@hedef\s*:\s*(.+?)\s*\|\s*(.+?)\s*(?::\s*|\s+)(\d+)\s*$/i);
  if (ob) { state.obj[ob[1].trim()] = {name: ob[2].trim(), n: +ob[3]}; return; }
  // @git x,y  → konuşan NPC belirtilen kareye yürür (diyalog bitince hareket eder)
  const mv = line.match(/^@git\s*(\d+)\s*,\s*(\d+)\s*$/i);

    const npc = dlg && dlg.npc;
    if (!npc) return toast('Bu konuşmada NPC yok');
    nGoal[npc.id] = {x: +mv[1], y: +mv[2], path: null};
    return;
  }
  const m = line.match(/^@(görev başla|görev bitir|eşya ver|eşya al)\s*:\s*(.+)$/i);
  if (!m) return;
  const kind = m[1].toLowerCase(), arg = m[2].trim();
  if (kind === 'görev başla') {
    if (!state.quests[arg]) { state.quests[arg] = 'aktif'; toast('Yeni görev: ' + arg); sfx('quest'); }
  } else if (kind === 'görev bitir') {
    if (state.quests[arg] && state.quests[arg] !== 'bitti') { state.quests[arg] = 'bitti'; toast('Görev tamamlandı: ' + arg); sfx('quest'); }
  } else {
    // Adet biçimleri: "Altın 5", "Altın :5", "Altın: 5"
    const mm = arg.match(/^(.*?)\s*(?::\s*|\s+)(\d+)$/);
    const name = mm ? mm[1].trim() : arg, n = mm ? +mm[2] : 1;
    if (kind === 'eşya ver') {
      const d = itemDef(name);
      const left = addItem(name, n, d.kind, d.val);
      toast(name + ' × ' + (n - left) + ' alındı' + (left ? ' (envanter dolu)' : ''));

    }

}
function openDialog(n) {

/* ---------- NPC hareketi ---------- */
// NPC'nin kayıtlı konumu (yoksa editördeki ilk konumu)
function npcTile(n) { return state.np[n.id] || {x: n.x, y: n.y}; }
function npcPos(n) {
  const t = npcTile(n);
  return ePos[n.id] || (ePos[n.id] = {x: t.x * T + T / 2, y: t.y * T + T / 2});
}
// Kare kare en kısa yol (BFS): duvarların ve kilitli çıkışların etrafından dolanır. Yol yoksa null.
function findPath(sx, sy, gx, gy) {
  if (solid(gx, gy)) return null;
  const W = cur.w, key = (i, j) => j * W + i;
  const prev = new Map([[key(sx, sy), -1]]);
  const q = [[sx, sy]];
  for (let qi = 0; qi < q.length; qi++) {
    const [x, y] = q[qi];
    if (x === gx && y === gy) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (solid(nx, ny) || prev.has(key(nx, ny))) continue;
      prev.set(key(nx, ny), key(x, y)); q.push([nx, ny]);
    }
  }
  if (!prev.has(key(gx, gy))) return null;
  const path = [];
  let k = key(gx, gy);
  while (k !== key(sx, sy)) { path.unshift([k % W, Math.floor(k / W)]); k = prev.get(k); }
  return path;
}
// Takip aktif mi: takip açık olmalı ve (varsa) takip koşulu sağlanmalı
function followActive(n) {
  return !!state.fol[n.id] && (!n.followCond || condMet(n.followCond));
}
// Bu sahnede görünen NPC'ler: kendi sahnesindekiler + başka sahneden takiple gelenler
function sceneNpcs() {
  const out = cur.npcs.filter(n => !state.loc[n.id] || state.loc[n.id].scene === curId);
  for (const id in state.loc) {
    const L = state.loc[id];
    if (L.scene === curId && !out.some(n => n.id === id)) out.push(L.npc);
  }
  return out;
}
// Sahne değişirken takip eden NPC'ler yeni sahneye, oyuncunun varış karesine taşınır
function moveFollowers(toId, sp) {
  const arr = sp || P.scenes[toId].spawn;
  for (const n of sceneNpcs()) {
    if (!followActive(n)) continue;
    state.loc[n.id] = {scene: toId, npc: JSON.parse(JSON.stringify(n))};
    state.np[n.id] = {x: arr.x, y: arr.y};
    delete ePos[n.id];
  }
}
// Takip eden NPC'ler: oyuncu 1.6 kareden uzaklaşınca yol bulup peşinden gider, yakında durur
let folRt = {};
function updateFollowers(dt) {
  if (uiBusy()) return;
  for (const n of sceneNpcs()) {
    if (!state.fol[n.id]) continue;
    if (!followActive(n)) {
      // Koşul sağlanmadı: NPC olduğu yerde durur ve konumu kaydedilir
      const p0 = npcPos(n);
      state.np[n.id] = {x: Math.floor(p0.x / T), y: Math.floor(p0.y / T)};
      folRt[n.id] = {path: [], t: 0};
      continue;
    }
    const p = npcPos(n), r = folRt[n.id] || (folRt[n.id] = {path: [], t: 0});
    const dist = Math.hypot(player.x - p.x, player.y - p.y);
    r.t -= dt;
    if (dist < 1.6 * T) { r.path = []; continue; }
    if (r.t <= 0 || !r.path.length) {
      r.t = 0.4;   // yolu sık sık yenile ki oyuncu hareket ederken takip sürsün
      r.path = findPath(Math.floor(p.x / T), Math.floor(p.y / T), Math.floor(player.x / T), Math.floor(player.y / T)) || [];
    }
    if (!r.path.length) continue;
    const wp = r.path[0], wx = wp[0] * T + T / 2, wy = wp[1] * T + T / 2;
    const dx = wx - p.x, dy = wy - p.y, d = Math.hypot(dx, dy), sp = 80 * dt;
    if (d <= sp) { p.x = wx; p.y = wy; r.path.shift(); }
    else { p.x += dx / d * sp; p.y += dy / d * sp; }
  }
}
// Hedefe yürüme: önce yol hesaplanır, sonra kare kare ilerler. Hedef ulaşılamazsa NPC durur.
function updateNpcs(dt) {
  if (uiBusy()) return;   // diyalog veya menü açıkken NPC'ler durur
  for (const n of sceneNpcs()) {
    if (followActive(n)) continue;   // takip eden NPC devriye gezmez
    // Hareket alanı tanımlıysa ve NPC diyalogla taşınmadıysa: başlangıç ile hedef arasında gidip gelir
    if (!nGoal[n.id] && n.moveTo && !state.np[n.id]) nGoal[n.id] = {x: n.moveTo.x, y: n.moveTo.y, patrol: true, home: {x: n.x, y: n.y}, path: null};
    const g = nGoal[n.id]; if (!g || g.failed) continue;
    const p = npcPos(n);
    if (!g.path) {
      g.path = findPath(Math.floor(p.x / T), Math.floor(p.y / T), g.x, g.y);
      if (!g.path) { g.failed = true; toast(n.name + ' hedefe ulaşamıyor'); continue; }
    }
    if (g.path.length === 0) {
      // Hedefe varıldı
      delete nGoal[n.id];
      if (g.patrol) nGoal[n.id] = {x: g.home.x, y: g.home.y, patrol: true, home: {x: g.x, y: g.y}, path: null};
      else state.np[n.id] = {x: g.x, y: g.y};
      continue;
    }
    const wp = g.path[0], wx = wp[0] * T + T / 2, wy = wp[1] * T + T / 2;
    const dx = wx - p.x, dy = wy - p.y, d = Math.hypot(dx, dy), sp = 70 * dt;
    if (d <= sp) { p.x = wx; p.y = wy; g.path.shift(); }
    else { p.x += dx / d * sp; p.y += dy / d * sp; }
  }
}

/* ---------- kilitli çıkışlar ---------- */
let lockHint = null;   // aynı kapı için tekrar tekrar uyarı vermemek için
function countItem(name) {
  let c = 0;
  for (const s of state.slots) if (s && s.name === name) c += s.n;
  return c;
}
function lockText(e) {
  const L = e.lock;
  return L.kind === 'item' ? L.name + ' × ' + L.n + ' gerekli' : "'" + L.name + "' görevi bitmeli";
}
function lockMet(e) {
  const L = e.lock;
  return L.kind === 'item' ? countItem(L.name) >= L.n : state.quests[L.name] === 'bitti';
}
// Oyuncu kapıya yaklaşınca koşul sağlanıyorsa kapıyı açar (harcama açıksa eşyayı siler)
function tryUnlocks() {
  for (const e of cur.exits) {
    if (!e.lock || state.unlocked[e.id]) continue;
    const d = Math.hypot(e.x * T + T / 2 - player.x, e.y * T + T / 2 - player.y);
    if (d < 1.9 * T) {
      if (lockMet(e)) {
        if (e.lock.kind === 'item' && e.lock.consume) removeItem(e.lock.name, e.lock.n);
        state.unlocked[e.id] = true;
        lockHint = null;
        toast('Kapı açıldı'); sfx('door');
      } else if (lockHint !== e.id) {
        lockHint = e.id;
        toast('Kilitli: ' + lockText(e));
      }
    } else if (lockHint === e.id) lockHint = null;
  }
}
function drawPadlock(x, y) {
  ctx.fillStyle = '#ffd54f'; ctx.fillRect(x - 6, y - 1, 12, 10);
  ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 2.5;

/* ---------- eşya, envanter ve etkileşim ---------- */
// Slotlara ekler (önce aynı eşyanın yığınına, sonra boş slota). Kalan adedi döndürür.
function addItem(name, n, kind, val) {
  let left = n;
  for (const s of state.slots) if (s && s.name === name && s.n < STACK && left > 0) {
    const add = Math.min(STACK - s.n, left); s.n += add; left -= add;
  }
  for (let k = 0; k < SLOTS && left > 0; k++) if (!state.slots[k]) {
    const add = Math.min(STACK, left); state.slots[k] = {name, n: add, kind: kind || 'normal', val: val || 0}; left -= add;
  }
  renderHotbar();
  return left;
}
function fits(name, n) {
  let room = 0;
  for (let k = 0; k < SLOTS; k++) {
    const s = state.slots[k];
    if (!s) room += STACK; else if (s.name === name) room += STACK - s.n;
  }
  return room >= n;
}
function removeItem(name, n) {
  let taken = 0;
  for (let k = 0; k < SLOTS && taken < n; k++) {

/* ---------- döngü ---------- */
function update(dt) {
  if (fadeDir === 1) {
    fade = Math.min(1, fade + dt * 2.5);
    if (fade >= 1) {
      fadeDir = -1;
      if (pending) {
        // Sahne değişirken açık kalmış diyalog/mağaza penceresi varsa kapat
        closeDlg(); if ($('modal').classList.contains('show')) closeModal();
        moveFollowers(pending.id, pending.sp);
        loadScene(pending.id, pending.sp); toast(cur.name); pending = null;
      }
    }
  } else if (fadeDir === -1) {
    fade = Math.max(0, fade - dt * 2.5);
    if (fade <= 0) fadeDir = 0;
  }
  if (mode === 'play') {
    if (exitCool > 0) exitCool -= dt;
    if (dashCool > 0) dashCool -= dt;
    if (pHurtCool > 0) pHurtCool -= dt;
    if (atkCool > 0) atkCool -= dt;
    if (hitFlash > 0) hitFlash -= dt;
    let isMoving = false;
    if (!uiBusy() && fadeDir === 0) {
      if (dashReq && dashCool <= 0) { dash = 0.2; dashCool = 0.8; }
      if (dash > 0) {
        dash -= dt; isMoving = true;
        moveBy(face.x, face.y, 560 * dt);
      } else {
        const v = inputVec();
        if (v.x || v.y) {
          const m = Math.hypot(v.x, v.y);
          face = {x: v.x / m, y: v.y / m};
          walkT += dt; isMoving = true;
          moveBy(v.x, v.y, 125 * dt);
        }
      }
      if (exitCool <= 0) {
        const tx = Math.floor(player.x / T), ty = Math.floor(player.y / T);
        const ex = cur.exits.find(e => e.x === tx && e.y === ty);
        if (ex && P.scenes[ex.to]) changeScene(ex.to, null);
      }
      const ptx = Math.floor(player.x / T), pty = Math.floor(player.y / T);
      const tv = ptx >= 0 && pty >= 0 && ptx < cur.w && pty < cur.h ? cur.tiles[pty * cur.w + ptx] : 0;
      if (TILE[tv] && TILE[tv].hurt) hurt(TILE[tv].hurt);
      if (fireActiveAt(ptx, pty)) hurt(10);
      updateEnemies(dt);
      updateFires(dt);
      updateNeeds(dt, isMoving);
      tryUnlocks();
      if (interactReq) {
        // Elinde silah varsa ve yakında düşman varsa X vurur, yoksa normal etkileşim (eşya, tabela, NPC)
        const held = state.slots[state.hb];
        if (held && held.kind === 'weapon' && nearestEnemy(1.8 * T)) useSlot(state.hb);
        else interact();
      }
      if (actionReq) { const n = nearNpc(); if (n) openDialog(n); }
    }
    updateNpcs(dt);
    updateFollowers(dt);
    btnA.classList.toggle('hot', !uiBusy() && !!nearNpc());
    $('btnX').classList.toggle('hot', !uiBusy() && !!nearestInteractable());
  }
  actionReq = false; interactReq = false; dashReq = false;
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); updateCam(); draw();
  requestAnimationFrame(frame);
}

/* ---------- yardımcılar ---------- */
function el(tag, attrs, kids) {
  const e = document.createElement(tag);
  attrs = attrs || {};
  for (const k in attrs) {
    if (k === 'on') for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]);
    else if (k in e) e[k] = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids || []) e.append(c);
  return e;
}
function row(label, ...kids) {
  return el('div', {className: 'row'}, [el('span', {textContent: label}), ...kids]);
}
function inp(type, val, fn, evt) {
  return el('input', {type, value: val, on: {[evt || 'input']: e => fn(type === 'number' ? Number(e.target.value) : e.target.value)}});
}
function btn(label, cls, fn) { return el('button', {textContent: label, className: cls || '', on: {click: fn}}); }
function sceneSelect(v, fn) {
  const s = el('select', {on: {change: e => fn(e.target.value)}});
  for (const id in P.scenes) s.append(el('option', {value: id, textContent: P.scenes[id].name}));
  s.value = v; return s;
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
}
function download(name, txt, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type})); a.download = name;
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportHTML() {
  const data = JSON.stringify(P).replace(/</g, '\\u003c');
  let html = document.documentElement.outerHTML;
  html = html.replace('/*EMBED*/' + 'null', '/*EMBED*/' + data)
             .replace(/<body[^>]*>/, '<body class="embedded mode-play">');
  return '<!doctype html>\n' + html;
}

function parseRecipes() {

      return m ? {name: m[1].trim(), n: +m[2]} : {name: s.trim(), n: 1};

function lists() { return {npc: cur.npcs, exit: cur.exits, item: cur.items, sign: cur.signs, enemy: cur.enemies, rain: cur.rains, fire: cur.fires, bench: cur.benches}; }
function objAt(i, j) {
  const L = lists();
  for (const type of ['npc', 'exit', 'item', 'sign', 'enemy', 'rain', 'fire', 'bench']) {
    const ref = L[type].find(o => o.x === i && o.y === j);

function applyTool(i, j, first) {

  if (tool === 'erase') { cur.tiles[idx] = 0; removeObjAt(i, j); }
  else if (tool.startsWith('tile:')) { if (!objAt(i, j)) cur.tiles[idx] = +tool.slice(5); }
  else if (tool === 'spawn') { cur.spawn = {x: i, y: j}; }
  else if (tool === 'select') { if (first) { const o = objAt(i, j); if (o) openObj(o); } }
  else if (first && (tool === 'npc' || tool === 'exit' || tool === 'item' || tool === 'sign' || tool === 'enemy' || tool === 'rain' || tool === 'fire' || tool === 'bench')) {
    const o = objAt(i, j);
    if (o) openObj(o);
    else {
      cur.tiles[idx] = 0;
      if (tool === 'npc') {
        const n = {id: newId(), x: i, y: j, name: 'NPC', color: '#ffb74d', text: 'Merhaba!'};

      } else if (tool === 'rain') {

  const k = e.key.toLowerCase(); keys[k] = true;
  if (mode !== 'play') return;
  if (k === ' ') { e.preventDefault(); actionReq = true; }
  else if (k === 'x') interactReq = true;
  else if (k === 'z') dashReq = true;
  else if (k === 'e') { if ($('modal').classList.contains('show')) closeModal(); else openInventory(); }
  else if (k === 'q') { if (!uiBusy()) useSlot(state.hb); }
  else if (/^[1-9]$/.test(k)) selectSlot(+k - 1);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('resize', resize);
addEventListener('resize', applyRotation);

/* ---------- üst çubuk ---------- */
$('btnPlay').onclick = () => setMode('play');
$('btnEdit').onclick = () => setMode('edit');
$('btnHud').onclick = () => {
  const on = document.body.classList.toggle('hud-edit');
  $('btnHud').classList.toggle('on', on);
  if (on) toast('HUD öğelerini sürükleyerek yerleştir');
  else changed();
};
$('btnRecipe').onclick = recipeModal;
$('sceneSel').onchange = e => { curId = e.target.value; cur = P.scenes[curId]; sel = null; };
// prompt() bazı önizleme/webview ortamlarında engellenir (null döner), bu yüzden kendi pencerimizi kullanıyoruz
function newSceneModal() {
  const input = el('input', {type: 'text', value: 'Yeni sahne', style: 'flex:1'});
  openModal('Yeni sahne', [
    row('Sahne adı', input),
    row('', btn('Oluştur', '', () => {
      const name = input.value.trim();
      if (!name) return toast('Bir ad gir');
      const id = 's' + Date.now().toString(36);
      P.scenes[id] = {name, w: 16, h: 12, bg: '#1d2d1f', tiles: borderTiles(16, 12), spawn: {x: 2, y: 6}, npcs: [], exits: [], items: [], signs: [], enemies: [], rains: [], fires: [], benches: []};
      curId = id; cur = P.scenes[id]; sel = null;
      closeModal(); refreshSceneSel(); changed();
      toast('Sahne oluşturuldu: ' + name);
    }))
  ]);
  input.focus();
}
$('btnAddScene').onclick = newSceneModal;
$('btnScene').onclick = sceneModal;
$('mclose').onclick = closeModal;
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
$('btnExport').onclick = () => { save(); download('oyun.html', exportHTML(), 'text/html'); };
$('btnBackup').onclick = () => download('proje.json', JSON.stringify(P, null, 2), 'application/json');
$('btnLoad').onclick = () => $('fileIn').click();
$('fileIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    P = sanitize(JSON.parse(await f.text()));
    curId = P.start; cur = P.scenes[curId]; sel = null;
    refreshSceneSel(); applyHud(); changed(); toast('Yüklendi');
  } catch (err) { toast('Dosya hatalı'); }
  e.target.value = '';
};

/* ---------- oyun düğmeleri ---------- */
$('btnSaveGame').onclick = () => { if (!uiBusy()) saveGame(); };
$('btnLoadGame').onclick = () => { if (!uiBusy()) loadGame(); };
$('btnNewGame').onclick = () => { if (!uiBusy()) newGame(); };
$('btnQuest').onclick = () => { if (!uiBusy()) showQuests(); };

/* ---------- başlangıç ---------- */
(function init() {
  if (EMBED) {
    P = sanitize(EMBED);
    curId = P.start; cur = P.scenes[curId];
    document.body.className = 'embedded mode-play';
    mode = 'play';
    startPlay();
  } else {
    P = sanitize(load() || defaultProject());
    curId = P.start; cur = P.scenes[curId];
    buildPalette();
    setMode('edit');
  }
  applyHud();
  renderHotbar();
  resize();
  applyRotation();
  requestAnimationFrame(frame);
})();
</script>
</body>
